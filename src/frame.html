<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saved credentials</title>
    <link rel="stylesheet" href="frame.css" />
  </head>
  <body>
    <form id="form" autocomplete="off">
      <div class="origin" id="origin">Loading…</div>
      <label>
        Username
        <input id="username" name="username" type="text" maxlength="1024" required disabled />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" maxlength="1024" disabled />
      </label>
      <button id="submit" type="submit" disabled>Submit</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <script src="frame.js"></script>
  </body>
</html>
